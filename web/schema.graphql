"""
`Issue`.
"""
type Issue {
	id: String!
	identifier: String!
	previousIdentifiers: [String!]!
	title: String!
	description: String
	priority: Int!
	estimate: Int
	teamId: String!
	stateId: String!
	stateName: String!
	stateType: String!
	assigneeId: String
	creatorId: String
	parentId: String
	projectId: String
	projectMilestoneId: String
	cycleId: String
	labelIds: [String!]!
	dueDate: String
	sortOrder: Float!
	startedAt: String
	completedAt: String
	canceledAt: String
	archivedAt: String
	trashed: Boolean!
	createdAt: String!
	updatedAt: String!
}

type IssueConnection {
	nodes: [Issue!]!
	hasNextPage: Boolean!
	endCursor: String
}

input IssueCreateInput {
	id: String
	teamId: String!
	title: String
	description: String
	stateId: String
	assigneeId: String
	priority: Int
	estimate: Float
	labelIds: [String!]
	parentId: String
	projectId: String
	projectMilestoneId: String
	cycleId: String
	dueDate: String
	sortOrder: Float
}

"""
`IssueLabel`.
"""
type IssueLabel {
	id: String!
	name: String!
	color: String!
	description: String
	teamId: String
	parentId: String
	isGroup: Boolean!
	groupType: String
	retiredAt: String
	archivedAt: String
	createdAt: String!
	updatedAt: String!
}

input IssueLabelCreateInput {
	name: String!
	color: String
	description: String
	teamId: String
	parentId: String
	isGroup: Boolean
	groupType: String
}

type IssueLabelPayload {
	success: Boolean!
	issueLabel: IssueLabel
}

input IssueLabelUpdateInput {
	name: String
	color: String
	description: String
	parentId: String
	isGroup: Boolean
	groupType: String
}

type IssuePayload {
	success: Boolean!
	issue: Issue
}

input IssueRelationCreateInput {
	issueId: String!
	relatedIssueId: String!
	"""
	`blocks`, `related` oder `duplicate`.
	"""
	type: String!
}

"""
Tri-State: ein weggelassenes Feld bleibt unverändert, ein explizites `null` leert es.
"""
input IssueUpdateInput {
	title: String
	description: String
	stateId: String
	assigneeId: String
	priority: Int
	estimate: Float
	teamId: String
	parentId: String
	labelIds: [String!]
	addedLabelIds: [String!]
	removedLabelIds: [String!]
	projectId: String
	projectMilestoneId: String
	cycleId: String
	dueDate: String
	sortOrder: Float
}

type Mutation {
	"""
	Platzhalter des Scaffolds.
	"""
	_orgMutationReady: Boolean!
	"""
	Ändert Workspace-Settings (Admin/Owner).
	"""
	workspaceUpdate(input: WorkspaceUpdateInput!): WorkspacePayload!
	"""
	Platzhalter des Scaffolds.
	"""
	_teamMutationReady: Boolean!
	teamCreate(input: TeamCreateInput!): TeamPayload!
	teamUpdate(id: String!, input: TeamUpdateInput!): TeamPayload!
	"""
	Hängt ein Team unter einen Parent (`parentId = null`: Un-Nesting). Nur Workspace-Admins.
	"""
	nestTeam(teamId: String!, parentId: String, options: NestTeamOptions): TeamPayload!
	teamMembershipCreate(teamId: String!, userId: String!, owner: Boolean): SuccessPayload!
	teamMembershipDelete(teamId: String!, userId: String!): SuccessPayload!
	workflowStateCreate(input: WorkflowStateCreateInput!): WorkflowStatePayload!
	workflowStateUpdate(id: String!, input: WorkflowStateUpdateInput!): WorkflowStatePayload!
	"""
	Archiviert einen Status; mit Issues ist `targetStateId` Pflicht.
	"""
	workflowStateArchive(id: String!, targetStateId: String): SuccessPayload!
	"""
	Platzhalter des Scaffolds.
	"""
	_issueMutationReady: Boolean!
	issueCreate(input: IssueCreateInput!): IssuePayload!
	issueUpdate(id: String!, input: IssueUpdateInput!): IssuePayload!
	"""
	Legt das Issue in den Papierkorb (`trash`) bzw. stellt es mit `issueUnarchive` wieder her.
	"""
	issueArchive(id: String!, trash: Boolean): IssuePayload!
	issueUnarchive(id: String!): IssuePayload!
	issueDelete(id: String!, permanentlyDelete: Boolean): IssuePayload!
	issueRelationCreate(input: IssueRelationCreateInput!): IssuePayload!
	"""
	Platzhalter des Scaffolds.
	"""
	_labelMutationReady: Boolean!
	issueLabelCreate(input: IssueLabelCreateInput!): IssueLabelPayload!
	issueLabelUpdate(id: String!, input: IssueLabelUpdateInput!): IssueLabelPayload!
	issueLabelRetire(id: String!): IssueLabelPayload!
	issueLabelRestore(id: String!): IssueLabelPayload!
	"""
	Platzhalter des Scaffolds.
	"""
	_commentMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_cycleMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_projectMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_initiativeMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_viewMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_searchMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_notificationMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_documentMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_templateMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_triageMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_overviewMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_webhookMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_importMutationReady: Boolean!
}

input NestTeamOptions {
	addMissingMembersToParent: Boolean
	downgradeVisibility: Boolean
	inheritWorkflowStatuses: Boolean
	inheritIssueEstimation: Boolean
}

"""
`Organization`.
"""
type Organization {
	id: String!
	name: String!
	urlKey: String!
	previousUrlKeys: [String!]!
	logoUrl: String
	fiscalYearStartMonth: Int!
	initiativesEnabled: Boolean!
	createdAt: String!
	updatedAt: String!
}

type Query {
	"""
	Platzhalter des Scaffolds.
	"""
	_orgReady: Boolean!
	"""
	Der Workspace des Aufrufers.
	"""
	workspace: Organization!
	"""
	Platzhalter des Scaffolds.
	"""
	_teamReady: Boolean!
	"""
	Sichtbare Teams (private Teams ohne Mitgliedschaft erscheinen nicht).
	"""
	teams(query: String, parentTeam: String, ancestorTeam: String, includeArchived: Boolean, first: Int): [Team!]!
	"""
	Ein Team per UUID, Key oder Name; nicht sichtbar → `not_found`.
	"""
	team(id: String!): Team!
	"""
	Workflow-Status eines Teams.
	"""
	workflowStates(teamId: String!): [WorkflowState!]!
	"""
	Platzhalter des Scaffolds.
	"""
	_issueReady: Boolean!
	"""
	Ein Issue per UUID oder Kennung (auch frühere); nicht sichtbar → `not_found`.
	"""
	issue(id: String!): Issue!
	"""
	Issues der sichtbaren Teams.
	"""
	issues(teamId: String, assigneeId: String, state: String, label: String, projectId: String, cycleId: String, priority: Int, includeArchived: Boolean, first: Int, after: String): IssueConnection!
	"""
	Platzhalter des Scaffolds.
	"""
	_labelReady: Boolean!
	"""
	Sichtbare Issue-Labels (Workspace und Teams, optional für ein Team samt Vorfahren).
	"""
	issueLabels(teamId: String, name: String, includeGroups: Boolean, includeArchived: Boolean, first: Int): [IssueLabel!]!
	"""
	Platzhalter des Scaffolds.
	"""
	_commentReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_cycleReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_projectReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_initiativeReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_viewReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_searchReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_notificationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_documentReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_templateReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_triageReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_overviewReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_webhookReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_importReady: Boolean!
}


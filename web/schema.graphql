type Mutation {
	"""
	Ändert Workspace-Settings (Admin/Owner).
	"""
	workspaceUpdate(input: WorkspaceUpdateInput!): WorkspacePayload!
	teamCreate(input: TeamCreateInput!): TeamPayload!
	teamUpdate(id: String!, input: TeamUpdateInput!): TeamPayload!
	"""
	Hängt ein Team unter einen Parent (`parentId = null`: Un-Nesting). Nur Workspace-Admins.
	"""
	nestTeam(teamId: String!, parentId: String, options: NestTeamOptions): TeamPayload!
	teamMembershipCreate(teamId: String!, userId: String!, owner: Boolean): SuccessPayload!
	teamMembershipDelete(teamId: String!, userId: String!): SuccessPayload!
	workflowStateCreate(input: WorkflowStateCreateInput!): WorkflowStatePayload!
	workflowStateUpdate(id: String!, input: WorkflowStateUpdateInput!): WorkflowStatePayload!
	"""
	Archiviert einen Status; mit Issues ist `targetStateId` Pflicht.
	"""
	workflowStateArchive(id: String!, targetStateId: String): SuccessPayload!
	issueCreate(input: IssueCreateInput!): IssuePayload!
	issueUpdate(id: String!, input: IssueUpdateInput!): IssuePayload!
	"""
	Legt das Issue in den Papierkorb (`trash`) bzw. stellt es mit `issueUnarchive` wieder her.
	"""
	issueArchive(id: String!, trash: Boolean): IssuePayload!
	issueUnarchive(id: String!): IssuePayload!
	issueDelete(id: String!, permanentlyDelete: Boolean): IssuePayload!
	issueRelationCreate(input: IssueRelationCreateInput!): IssuePayload!
	issueLabelCreate(input: IssueLabelCreateInput!): IssueLabelPayload!
	issueLabelUpdate(id: String!, input: IssueLabelUpdateInput!): IssueLabelPayload!
	issueLabelRetire(id: String!): IssueLabelPayload!
	issueLabelRestore(id: String!): IssueLabelPayload!
	"""
	Neuer Thread, Antwort (`parentId`) oder Inline-Kommentar (`quotedText`).
	"""
	commentCreate(input: CommentCreateInput!): CommentPayload!
	"""
	Bearbeitet den Body (nur der Autor).
	"""
	commentUpdate(id: String!, input: CommentUpdateInput!): CommentPayload!
	"""
	Löscht einen Kommentar (Autor oder Admin; Inline-Wurzeln nicht).
	"""
	commentDelete(id: String!): CommentDeletePayload!
	"""
	Löst den Thread auf (optional mit hervorgehobener Antwort).
	"""
	commentResolve(id: String!, resolvingCommentId: String): CommentPayload!
	"""
	Öffnet einen aufgelösten Thread wieder.
	"""
	commentUnresolve(id: String!): CommentPayload!
	"""
	Reaktion hinzufügen (idempotent pro User, Ziel und Emoji).
	"""
	reactionCreate(input: ReactionCreateInput!): ReactionPayload!
	"""
	Entfernt die eigene Reaktion.
	"""
	reactionDelete(id: String!): ReactionDeletePayload!
	"""
	Hängt einen Link an oder finalisiert einen Upload (`url` = `assetUrl` aus `fileUpload`).
	"""
	attachmentCreate(input: AttachmentCreateInput!): AttachmentPayload!
	"""
	Hängt einen Link an (Dedupe pro Issue und URL).
	"""
	attachmentLinkURL(issueId: String!, url: String!, title: String): AttachmentPayload!
	"""
	Entfernt einen Anhang.
	"""
	attachmentDelete(id: String!): AttachmentDeletePayload!
	"""
	Bereitet einen Direkt-Upload vor (ohne Ziel-Issue, z. B. für Bilder in Markdown).
	"""
	fileUpload(filename: String!, contentType: String!, size: Int!): UploadPayload!
	"""
	Cycle-Einstellungen eines Teams ändern (aktivieren, Zeitplan, „Active issues“, deaktivieren).
	"""
	teamCyclesUpdate(teamId: String!, input: TeamCyclesInput!): CycleSuccessPayload!
	"""
	Cycle umbenennen bzw. Beginn/Ende verschieben (nur künftige Cycles und das Ende des aktiven).
	"""
	cycleUpdate(id: String!, input: CycleUpdateInput!): CyclePayload!
	"""
	Verschiebt den angegebenen künftigen Cycle und alle späteren um `daysToShift` Tage.
	"""
	cycleShiftAll(id: String!, daysToShift: Int!): CyclesPayload!
	"""
	Startet den nächsten Cycle heute (laufender Cycle wird abgeschlossen, unfertige Issues rollen über).
	"""
	cycleStartUpcomingCycleToday(id: String!): CyclePayload!
	"""
	Archiviert einen abgeschlossenen oder künftigen Cycle (Issues verlieren die Zuordnung).
	"""
	cycleArchive(id: String!): CycleSuccessPayload!
	projectCreate(input: ProjectInput!): ProjectPayload!
	projectUpdate(id: String!, input: ProjectInput!): ProjectPayload!
	"""
	Archiviert bzw. stellt ein Projekt wieder her (nur Admins und Lead).
	"""
	projectArchive(id: String!, archived: Boolean): ProjectPayload!
	"""
	Papierkorb (30 Tage) bzw. Wiederherstellen (nur per UUID).
	"""
	projectDelete(id: String!, restore: Boolean): ProjectSuccessPayload!
	projectMilestoneCreate(projectId: String!, input: MilestoneInput!): ProjectMilestonePayload!
	projectMilestoneUpdate(projectId: String!, id: String!, input: MilestoneInput!): ProjectMilestonePayload!
	"""
	Löscht den Meilenstein; seine Issues bleiben im Projekt.
	"""
	projectMilestoneDelete(projectId: String!, id: String!): ProjectSuccessPayload!
	"""
	Veröffentlicht ein Status-Update (`health`: onTrack | atRisk | offTrack).
	"""
	projectUpdateCreate(projectId: String!, body: String!, health: String, isDiffHidden: Boolean): ProjectUpdatePayload!
	projectUpdateEdit(id: String!, body: String, health: String): ProjectUpdatePayload!
	"""
	Löscht (archiviert) ein Status-Update.
	"""
	projectUpdateDelete(id: String!): ProjectSuccessPayload!
	initiativeCreate(input: InitiativeInput!): InitiativePayload!
	initiativeUpdate(id: String!, input: InitiativeInput!): InitiativePayload!
	"""
	Entfernt eine Eltern-Beziehung.
	"""
	initiativeParentRemove(initiativeId: String!, parentId: String!): InitiativeSuccessPayload!
	"""
	Ordnet ein Projekt der Initiative zu.
	"""
	initiativeToProjectCreate(initiativeId: String!, projectId: String!): InitiativeSuccessPayload!
	"""
	Löst die Zuordnung eines Projekts.
	"""
	initiativeToProjectDelete(initiativeId: String!, projectId: String!): InitiativeSuccessPayload!
	initiativeArchive(id: String!, archived: Boolean): InitiativeSuccessPayload!
	"""
	Papierkorb (30 Tage).
	"""
	initiativeDelete(id: String!): InitiativeSuccessPayload!
	initiativeUpdateCreate(initiativeId: String!, body: String!, health: String, isDiffHidden: Boolean): InitiativeUpdatePayload!
	initiativeUpdateEdit(id: String!, body: String, health: String): InitiativeUpdatePayload!
	initiativeUpdateDelete(id: String!): InitiativeSuccessPayload!
	"""
	Platzhalter des Scaffolds.
	"""
	_viewMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_searchMutationReady: Boolean!
	"""
	Gelesen/ungelesen, Snooze/Unsnooze.
	"""
	notificationUpdate(id: String!, input: NotificationUpdateInput!): NotificationPayload!
	"""
	Alle Notifications als gelesen markieren (`filter`: all, read, completed).
	"""
	notificationMarkReadAll(filter: String): NotificationBatchActionPayload!
	"""
	Archiviert die Gruppe der Notification (`archive: false` = Undo).
	"""
	notificationArchive(id: String!, archive: Boolean): NotificationPayload!
	"""
	Archiviert alle (`filter`: all, read, completed).
	"""
	notificationArchiveAll(filter: String): NotificationBatchActionPayload!
	"""
	Issue abonnieren (`user`: anderen User hinzufügen).
	"""
	issueSubscribe(id: String!, user: String): IssueSubscriptionPayload!
	"""
	Issue-Abo beenden.
	"""
	issueUnsubscribe(id: String!, user: String): IssueSubscriptionPayload!
	"""
	Objekt-Abo anlegen oder ändern (Upsert je Ziel und Kontext).
	"""
	notificationSubscriptionUpdate(input: NotificationSubscriptionInput!): NotificationSubscription!
	"""
	Eigene Einstellungen ändern (die Inbox ist nicht abschaltbar).
	"""
	notificationSettingsUpdate(input: NotificationSettingsInput!): NotificationSettings!
	documentCreate(input: DocumentCreateInput!): DocumentPayload!
	documentUpdate(id: String!, input: DocumentUpdateInput!): DocumentPayload!
	"""
	Papierkorb (30 Tage wiederherstellbar).
	"""
	documentDelete(id: String!): DocumentPayload!
	documentUnarchive(id: String!): DocumentPayload!
	"""
	Stellt den Inhalt eines Snapshots als neue Version wieder her.
	"""
	documentContentRestore(documentId: String!, historyId: String!): DocumentPayload!
	templateCreate(input: TemplateCreateInput!): TemplatePayload!
	templateUpdate(id: String!, input: TemplateUpdateInput!): TemplatePayload!
	templateDelete(id: String!): TemplatePayload!
	"""
	Setzt (oder löscht mit `templateId: null`) ein Default-Template des Teams.
	"""
	teamDefaultTemplateSet(teamId: String!, slot: TemplateDefaultSlot!, templateId: String): Boolean!
	"""
	Legt ein Issue (inkl. Sub-Issues) aus einem Template an – eine Transaktion.
	"""
	templateIssueCreate(templateId: String!, input: TemplateIssueCreateInput!): TemplateIssuePayload!
	"""
	Accept: Status `defaultIssueState` oder gewählt, optionaler Kommentar.
	"""
	issueTriageAccept(id: String!, input: TriageAcceptGqlInput): IssuePayload!
	"""
	Decline: Status `canceled`, optionaler Begründungskommentar.
	"""
	issueTriageDecline(id: String!, input: TriageDeclineGqlInput): IssuePayload!
	"""
	Als Duplikat eines anderen Issues markieren (Anhänge wandern zum kanonischen Issue).
	"""
	issueTriageDuplicate(id: String!, duplicateOfId: String!, comment: String): IssuePayload!
	"""
	Snooze bis `snoozedUntilAt` (höchstens ein Jahr).
	"""
	issueTriageSnooze(id: String!, snoozedUntilAt: DateTime!): IssuePayload!
	"""
	Beendet ein Snooze vorzeitig.
	"""
	issueTriageUnsnooze(id: String!): IssuePayload!
	"""
	„Move to team“: im Zielteam gilt die Triage-Regel erneut.
	"""
	issueTriageMove(id: String!, teamId: String!): IssuePayload!
	"""
	Setzt die Triage-Verantwortung (Personen oder Schichtplan).
	"""
	triageResponsibilitySet(input: TriageResponsibilityGqlInput!): Boolean!
	"""
	Entfernt die Triage-Verantwortung eines Teams.
	"""
	triageResponsibilityDelete(teamId: String!): Boolean!
	"""
	Legt einen Schichtplan an (Admin).
	"""
	timeScheduleCreate(name: String!, entries: [TimeScheduleEntryGqlInput!]!): TimeSchedule!
	"""
	Platzhalter des Scaffolds.
	"""
	_overviewMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_webhookMutationReady: Boolean!
	"""
	Platzhalter des Scaffolds.
	"""
	_importMutationReady: Boolean!
}


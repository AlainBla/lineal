`null` leert (wo erlaubt).
"""
input ProjectInput {
	name: String
	summary: String
	description: String
	icon: String
	color: String
	priority: Int
	"""
	Projektstatus (UUID, Name oder Kategorie) – gegen den Satz des Lead-Teams aufgelöst.
	"""
	state: String
	lead: String
	leadTeam: String
	setTeams: [String!]
	addTeams: [String!]
	removeTeams: [String!]
	"""
	Beim Entfernen eines Teams dessen Issues vom Projekt lösen (sonst `invalid_request`).
	"""
	detachIssuesOfRemovedTeams: Boolean
	labels: [String!]
	addMembers: [String!]
	removeMembers: [String!]
	setInitiatives: [String!]
	addInitiatives: [String!]
	removeInitiatives: [String!]
	startDate: String
	startDateResolution: String
	targetDate: String
	targetDateResolution: String
	links: [LinkInput!]
	"""
	Nur beim Anlegen: Template (UUID oder Name); hat Vorrang vor `useDefaultTemplate`.
	"""
	templateId: String
	"""
	Nur beim Anlegen: wendet `defaultProjectTemplate` des Lead-Teams an (docs/06 §2.8).
	"""
	useDefaultTemplate: Boolean
}

type ProjectMilestone {
	id: String!
	project: ProjectReference!
	name: String!
	description: String
	targetDate: String
	sortOrder: Float!
	"""
	`unstarted` | `next` | `overdue` | `done`.
	"""
	status: String!
	"""
	0..1.
	"""
	progress: Float!
	issueCount: Int!
	completedIssueCount: Int!
	createdAt: String!
	updatedAt: String!
}

type ProjectMilestonePayload {
	success: Boolean!
	projectMilestone: ProjectMilestone
}

type ProjectPayload {
	success: Boolean!
	project: Project
}

type ProjectReference {
	id: String!
	identifier: String!
	name: String!
}

type ProjectStatusInfo {
	id: String!
	name: String!
	type: String!
	color: String!
}

type ProjectSuccessPayload {
	success: Boolean!
}

type ProjectUpdate {
	id: String!
	project: ProjectReference!
	user: PlanningRef
	body: String!
	health: String!
	diff: String
	diffMarkdown: String
	isDiffHidden: Boolean!
	isStale: Boolean!
	commentCount: Int!
	editedAt: String
	archivedAt: String
	createdAt: String!
	updatedAt: String!
}

type ProjectUpdatePayload {
	success: Boolean!
	projectUpdate: ProjectUpdate
}


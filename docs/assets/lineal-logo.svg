<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-labelledby="t d">
  <title id="t">Lineal</title>
  <desc id="d">Ein Lineal mit Zentimeter- und Millimeterstrichen, darauf der Schriftzug Lineal.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c86ea"/>
      <stop offset="1" stop-color="#5e6ad2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(20 36) rotate(-4 300 44)">
    <rect width="600" height="88" rx="12" fill="url(#body)"/>
    <rect width="600" height="30" rx="12" fill="url(#shine)"/>
    <g stroke="#ffffff" stroke-linecap="round" opacity=".9">
      <!-- Millimeter- (kurz), Halbzentimeter- (mittel) und Zentimeterstriche (lang) -->
      <g id="cm" stroke-width="2">
        <line x1="0" y1="0" x2="0" y2="30"/>
        <line x1="5" y1="0" x2="5" y2="10" stroke-width="1.5"/>
        <line x1="10" y1="0" x2="10" y2="10" stroke-width="1.5"/>
        <line x1="15" y1="0" x2="15" y2="10" stroke-width="1.5"/>
        <line x1="20" y1="0" x2="20" y2="10" stroke-width="1.5"/>
        <line x1="25" y1="0" x2="25" y2="18"/>
        <line x1="30" y1="0" x2="30" y2="10" stroke-width="1.5"/>
        <line x1="35" y1="0" x2="35" y2="10" stroke-width="1.5"/>
        <line x1="40" y1="0" x2="40" y2="10" stroke-width="1.5"/>
        <line x1="45" y1="0" x2="45" y2="10" stroke-width="1.5"/>
      </g>
      <use href="#cm" x="20"/><use href="#cm" x="70"/><use href="#cm" x="120"/><use href="#cm" x="170"/>
      <use href="#cm" x="220"/><use href="#cm" x="270"/><use href="#cm" x="320"/><use href="#cm" x="370"/>
      <use href="#cm" x="420"/><use href="#cm" x="470"/><use href="#cm" x="520"/>
      <line x1="570" y1="0" x2="570" y2="30" stroke-width="2"/>
    </g>
    <g fill="#ffffff" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" opacity=".75" text-anchor="middle">
      <text x="20" y="44">0</text><text x="120" y="44">2</text><text x="220" y="44">4</text>
      <text x="320" y="44">6</text><text x="420" y="44">8</text><text x="520" y="44">10</text>
    </g>
    <text x="300" y="76" fill="#ffffff" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="6" text-anchor="middle">LINEAL</text>
  </g>
</svg>

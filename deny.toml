# cargo-deny: `cargo deny check advisories bans licenses` (siehe scripts/check.sh, optionaler Schritt).
# Installation: `cargo install cargo-deny --locked`.

[graph]
all-features = true

[advisories]
# Bekannte Sicherheitslücken (RustSec). Begründete Ausnahmen mit `ignore = [{ id, reason }]`.
version = 2
ignore = [
    # smallstr: nur „unmaintained“, keine Sicherheitslücke; transitive Abhängigkeit des
    # gepatchten yrs (vendor/yrs). Entfällt mit der Rückkehr auf ein offizielles yrs-Release.
    { id = "RUSTSEC-2026-0215", reason = "transitiv über vendor/yrs, nur unmaintained" },
    # chrono/chrono-tz: seit 17.11.2026 als „unmaintained“ markiert, keine Sicherheitslücke
    # und kein sicheres Upgrade. Tief eingebettet (u. a. async-graphql). Migration auf
    # jiff/time ist ein eigenes Vorhaben; bis dahin bewusst ignoriert.
    { id = "RUSTSEC-2026-0543", reason = "chrono nur unmaintained, kein CVE, Migration offen" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz nur unmaintained, kein CVE, Migration offen" },
]

[licenses]
version = 2
# Eigene Crates sind `UNLICENSED` (privat, nicht veröffentlicht).
private = { ignore = true }
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "MIT-0",
    # quoted_printable (lettre): gemeinfrei-ähnlich, ohne Bedingungen.
    "0BSD",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

name: lineal
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lineal
      POSTGRES_PASSWORD: lineal
      POSTGRES_DB: lineal
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineal"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:

name: lineal
# Entwicklung und Tests: `docker compose --profile dev up -d --wait` (nur PostgreSQL, Port 5440).
# Komplette Anwendung: `docker compose --profile app up -d --build` (siehe docs/15 §3.4).
# Die Entwicklungs-DB liegt im Profil `dev`, damit sie beim Prod-Deploy (`--profile app`) nicht
# mitstartet (S-41/LIN-41); sonst lief kurzzeitig ein Postgres mit dem Passwort `lineal` mit.
# Log-Rotation für alle App-Dienste (sonst wächst das json-file-Log unbegrenzt: ~9 MB/h im Test).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# S-08/LIN-35: Container-Härtung für die App-Dienste (server, worker, migrate, web). Kein
# Rechte-Eskalieren, keine Linux-Capabilities, Wurzel-FS nur lesbar (Schreibpfade liegen im
# Blob-Volume bzw. im tmpfs), PID-Grenze gegen Fork-Bomben. app-db bekommt eine eigene, weniger
# strenge Variante (Postgres braucht gosu/Init-Capabilities und schreibt an zu viele Pfade für
# read_only) – siehe dort. mem_limit/cpus bewusst NICHT hier (je Host zu messen, siehe Hand-off).
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  pids_limit: 2048
  tmpfs: ["/tmp"]

services:
  postgres:
    profiles: [dev]
    image: postgres:16
    environment:
      POSTGRES_USER: lineal
      POSTGRES_PASSWORD: lineal
      POSTGRES_DB: lineal
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineal"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Eigene Datenbank für den App-Stack (nicht die Entwicklungs-DB oben): Passwort Pflicht,
  # eigenes Volume, kein veröffentlichter Port. Das Passwort steht in DATABASE_URL, daher nur
  # URL-sichere Zeichen verwenden (z. B. `openssl rand -hex 24`).
  app-db:
    profiles: [app]
    logging: *logging
    # S-08: kein read_only (Postgres schreibt Daten ins Volume, PGDATA/Socket/Stats an viele Pfade).
    # gosu im Entrypoint braucht SETUID/SETGID bei JEDEM Start, der Init zusätzlich CHOWN/FOWNER/
    # DAC_OVERRIDE – daher cap_drop ALL plus genau diese zurück.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
    pids_limit: 2048
    image: postgres:16
    # Ohne Passwort klar scheitern (Compose-Interpolation `:?` würde auch `docker compose up`
    # ohne Profil blockieren).
    entrypoint:
      - sh
      - -c
      - 'test -n "$$POSTGRES_PASSWORD" || { echo "LINEAL_DB_PASSWORD must be set for the app stack (see .env.example)" >&2; exit 1; }; exec docker-entrypoint.sh postgres'
    environment:
      POSTGRES_USER: lineal
      POSTGRES_PASSWORD: ${LINEAL_DB_PASSWORD:-}
      POSTGRES_DB: lineal
    volumes:
      - appdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineal"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Einmalig vor Server/Worker: Migrationen anwenden.
  migrate:
    <<: *hardening
    profiles: [app]
    logging: *logging
    build: &server-build { context: ., target: server }
    image: lineal-server:latest
    command: ["migrate"]
    environment: &server-env
      DATABASE_URL: postgres://lineal:${LINEAL_DB_PASSWORD:-}@app-db:5432/lineal
      LINEAL_BASE_URL: ${LINEAL_BASE_URL:-http://localhost:8088}
      LINEAL_SESSION_SECRET: ${LINEAL_SESSION_SECRET:-}  # Pflicht, mind. 32 Zeichen: openssl rand -hex 32
      # Nur der nginx-Container (feste Adresse) darf X-Forwarded-For setzen – nicht das ganze
      # Subnetz, sonst zählte auch das Gateway (Host) als vertrauenswürdiger Proxy.
      LINEAL_TRUSTED_PROXIES: 172.31.88.10/32
      # Wer per GraphQL weitere Workspaces anlegen darf: disabled (Default) | admins | all.
      LINEAL_WORKSPACE_CREATION: ${LINEAL_WORKSPACE_CREATION:-disabled}
      LINEAL_INSTANCE_ADMINS: ${LINEAL_INSTANCE_ADMINS:-}
      # Mailversand über einen SMTP-Relay (z. B. Postfix auf dem Host: host.docker.internal);
      # leer = Mails nur ins Log.
      LINEAL_SMTP_HOST: ${LINEAL_SMTP_HOST:-}
      LINEAL_SMTP_PORT: ${LINEAL_SMTP_PORT:-25}
      LINEAL_MAIL_FROM: ${LINEAL_MAIL_FROM:-}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      app-db: { condition: service_healthy }
    restart: "no"
    healthcheck: { disable: true }

  server:
    <<: *hardening
    profiles: [app]
    logging: *logging
    build: *server-build
    image: lineal-server:latest
    command: ["serve"]
    extra_hosts: &host-gateway ["host.docker.internal:host-gateway"]
    environment: *server-env
    volumes:
      - blobs:/data/blobs
    networks: [default, edge]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    # Bereit = Datenbank erreichbar (/readyz), nicht nur "Prozess lebt" (/healthz).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    # SIGTERM -> geordnetes Beenden (LINEAL_SHUTDOWN_GRACE_SECS, Default 10 s) vor dem SIGKILL.
    stop_grace_period: 20s

  worker:
    <<: *hardening
    profiles: [app]
    logging: *logging
    build: *server-build
    image: lineal-server:latest
    command: ["worker"]
    extra_hosts: *host-gateway
    environment: *server-env
    volumes:
      - blobs:/data/blobs
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    # Der Worker hat keinen HTTP-Port: er schreibt alle 10 s einen Heartbeat (cli/worker.rs).
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/lineal-worker.heartbeat -mmin -1 2>/dev/null)\""]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    # Ein laufender Tick (Jobs, Zustellungen) darf zu Ende laufen.
    stop_grace_period: 30s

  web:
    <<: *hardening
    # nginx-unprivileged schreibt pid + Temp-Pfade; unter read_only als tmpfs bereitstellen
    # (überschreibt die tmpfs-Liste des Ankers, daher /tmp hier mit aufführen).
    tmpfs: ["/tmp", "/var/cache/nginx"]
    profiles: [app]
    logging: *logging
    build: { context: ., target: web }
    image: lineal-web:latest
    ports:
      - "127.0.0.1:${LINEAL_HTTP_PORT:-8088}:8080"
    networks:
      edge: { ipv4_address: 172.31.88.10 }
    depends_on:
      server: { condition: service_healthy }
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.88.0/24

volumes:
  pgdata:
  appdata:
  blobs:

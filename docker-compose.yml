name: lineal
# Standard (`docker compose up -d`): nur PostgreSQL für Entwicklung und Tests (Port 5440).
# Komplette Anwendung: `docker compose --profile app up -d --build` (siehe docs/15 §3.4).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lineal
      POSTGRES_PASSWORD: lineal
      POSTGRES_DB: lineal
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineal"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Einmalig vor Server/Worker: Migrationen anwenden.
  migrate:
    profiles: [app]
    build: &server-build { context: ., target: server }
    image: lineal-server:latest
    command: ["migrate"]
    environment: &server-env
      DATABASE_URL: postgres://lineal:lineal@postgres:5432/lineal
      LINEAL_BASE_URL: ${LINEAL_BASE_URL:-http://localhost:8088}
      LINEAL_SESSION_SECRET: ${LINEAL_SESSION_SECRET:-}  # Pflicht, mind. 32 Zeichen: openssl rand -hex 32
      # Nur nginx (Netz `edge`) darf X-Forwarded-For setzen.
      LINEAL_TRUSTED_PROXIES: 172.31.88.0/24
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    healthcheck: { disable: true }

  server:
    profiles: [app]
    build: *server-build
    image: lineal-server:latest
    command: ["serve"]
    environment: *server-env
    volumes:
      - blobs:/data/blobs
    networks: [default, edge]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    profiles: [app]
    build: *server-build
    image: lineal-server:latest
    command: ["worker"]
    environment: *server-env
    volumes:
      - blobs:/data/blobs
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck: { disable: true }

  web:
    profiles: [app]
    build: { context: ., target: web }
    image: lineal-web:latest
    ports:
      - "127.0.0.1:${LINEAL_HTTP_PORT:-8088}:8080"
    networks: [edge]
    depends_on:
      server: { condition: service_healthy }
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.88.0/24

volumes:
  pgdata:
  blobs:

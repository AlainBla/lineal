# Lineal – SSH-Härtung (LIN-52, Audit-Fund „SSH – Niedrig“).
#
# Ablegen als /etc/ssh/sshd_config.d/00-lineal-hardening.conf auf dem HOST (nicht im
# Container). Der Dateiname beginnt mit 00-, damit diese Werte VOR einem evtl.
# vorhandenen 50-cloud-init.conf greifen: sshd nimmt bei mehrfach gesetzten Optionen
# den ERSTEN Treffer. Vor dem Ablegen prüfen, ob sshd die Drop-ins überhaupt einliest
# und ob cloud-init `PasswordAuthentication yes` setzt – siehe Runbook docs/15 §3.4.
#
# NIEMALS echte Admin-IPs in diese (öffentlich versionierte) Datei schreiben. Die
# Port-/Quell-Beschränkung gehört in die Host-Firewall (nftables), nicht hierher.

# Keine Passwort-Anmeldung. Auf Debian/PAM reicht PasswordAuthentication allein NICHT –
# ohne die zweite Zeile bliebe keyboard-interactive (= ebenfalls Passwort) offen.
PasswordAuthentication no
KbdInteractiveAuthentication no

# root nur per Schlüssel (der Betreiber meldet sich als root an; `no` sperrte ihn aus).
PermitRootLogin prohibit-password

# Audit-Fund: X11Forwarding war an, wird nicht gebraucht.
X11Forwarding no

# Weniger Versuche je Verbindung (Brute-Force läuft ohnehin ins Leere, aber günstig).
MaxAuthTries 3

# Nur noch Public-Key (schließt u. a. keyboard-interactive/GSSAPI als Anmeldeweg aus).
AuthenticationMethods publickey

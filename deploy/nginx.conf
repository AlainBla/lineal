# nginx vor Lineal: liefert die Web-App aus, leitet API-Pfade an den Server weiter und setzt
# ein Edge-Rate-Limit vor das In-Process-Limit des Servers (docs/15, offene Punkte Rate-Limit).

# Edge-Limits je Client-IP (Werte bewusst großzügig; das Server-Limit bleibt die Feinsteuerung).
limit_req_zone $binary_remote_addr zone=lineal_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lineal_api:20m rate=50r/s;
# Gleichzeitige Echtzeit-Verbindungen (WebSocket /collab) je Client-IP.
limit_conn_zone $binary_remote_addr zone=lineal_collab_conn:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lineal_server {
    server server:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 64m;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Ersetzt (nicht anhängen): Der Server vertraut nur diesem Proxy (LINEAL_TRUSTED_PROXIES).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Login, Einladung, OAuth-Token: eng begrenzt.
    location ~ ^/(auth/login|invite/accept|oauth/token|oauth/register)$ {
        limit_req zone=lineal_auth burst=10 nodelay;
        proxy_pass http://lineal_server;
    }

    # Echtzeit-Sync (WebSocket).
    location = /sync {
        limit_req zone=lineal_api burst=100 nodelay;
        proxy_pass http://lineal_server;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Echtzeit-Mitbearbeitung (WebSocket, docs/06 §1.9 Stufe 2): Upgrade, lange Timeouts, kein
    # Puffer. Edge-Limits: Verbindungsaufbau je IP (limit_req) und gleichzeitige Verbindungen je IP
    # (limit_conn); der Server begrenzt zusätzlich je User, je Raum und je Verbindung.
    # Räume leben im Serverprozess: bei mehreren Server-Instanzen Sticky Sessions je Dokument nötig
    # (siehe docs/15, offene Punkte).
    location ^~ /collab/ {
        limit_req zone=lineal_api burst=60 nodelay;
        limit_conn lineal_collab_conn 40;
        proxy_pass http://lineal_server;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Bootstrap des Sync-Caches (HTTP, zeilenweises JSON): ohne Puffer, damit Pakete sofort ankommen.
    location = /sync/bootstrap {
        limit_req zone=lineal_api burst=20 nodelay;
        proxy_pass http://lineal_server;
        proxy_buffering off;
    }

    # MCP (Streamable HTTP, Antworten ggf. als Stream): ohne Puffer.
    location /mcp {
        limit_req zone=lineal_api burst=100 nodelay;
        proxy_pass http://lineal_server;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location ~ ^/(graphql|auth/|oauth/|uploads/|files/|invite/accept|\.well-known/|healthz$|readyz$) {
        limit_req zone=lineal_api burst=200 nodelay;
        proxy_pass http://lineal_server;
    }

    # Gehashte Build-Artefakte lange cachen.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Einladungsseite `/invite/<token>` (SPA): der Token steht in der URL, daher kein Referer an Dritte
    # und kein Caching. `POST /invite/accept` fängt die Regex-Location oben ab.
    location /invite/ {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files /index.html =404;
    }

    # SPA: alle übrigen Pfade auf index.html (Client-Routing), nie cachen.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}

# nginx vor Lineal: liefert die Web-App aus, leitet API-Pfade an den Server weiter und setzt
# ein Edge-Rate-Limit vor das In-Process-Limit des Servers (docs/15, offene Punkte Rate-Limit).

# Edge-Limits je Client-IP (Werte bewusst großzügig; das Server-Limit bleibt die Feinsteuerung).
limit_req_zone $binary_remote_addr zone=lineal_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lineal_api:20m rate=50r/s;
# Gleichzeitige Echtzeit-Verbindungen (WebSocket /collab) je Client-IP.
limit_conn_zone $binary_remote_addr zone=lineal_collab_conn:10m;
# S-11: Obergrenze gleichzeitiger Verbindungen je Client-IP über ALLE Pfade (nicht nur /collab).
# Großzügig, damit NAT-Büros (viele Clients hinter einer IP) nicht getroffen werden.
limit_conn_zone $binary_remote_addr zone=lineal_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Echte Client-IP statt Docker-Gateway: Ohne diese Zeilen sieht nginx hinter dem Port-Mapping für
# alle Clients dieselbe Gateway-Adresse (ein gemeinsamer Rate-Limit-Eimer, Audit-IP wertlos).
# Vertraut wird nur dem Gateway des edge-Netzes (der Host bzw. ein TLS-Reverse-Proxy auf dem Host);
# dieser MUSS die Client-IP in X-Forwarded-For setzen bzw. den Header überschreiben
# (z. B. Caddy: Standard; nginx: `proxy_set_header X-Forwarded-For $remote_addr;`).
# Die Gateway-Adresse folgt aus dem Subnetz in docker-compose.yml (172.31.88.0/24) und
# deploy/docker-compose.test.yml (172.31.97.0/24); bei anderem Subnetz anpassen.
set_real_ip_from 172.31.88.1;
set_real_ip_from 172.31.97.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# S-12: Zugriffslog ohne Query-String (z. B. die Parameter von /oauth/authorize) und mit
# redigierten Fähigkeits-Pfaden — /files, /uploads und /calendar tragen Zugriffs-Tokens in der
# URL. $uri ist der normalisierte Pfad ohne Query.
map $uri $loggable_uri {
    ~^(/(?:files|uploads|calendar|invite)/)    "$1<redacted>";
    default                                     $uri;
}
log_format lineal_masked '$remote_addr - [$time_local] '
                         '"$request_method $loggable_uri $server_protocol" '
                         '$status $body_bytes_sent "-" "$http_user_agent"';

# Der Upstream wird zur Laufzeit über Variable und Resolver aufgelöst (nicht nur beim Start):
# Nach `docker compose up --force-recreate server` (neue Container-IP) und bei gestopptem Server
# startet nginx trotzdem und findet den Server nach höchstens `valid` Sekunden wieder.
# 127.0.0.11 ist der eingebettete DNS-Server von Docker; außerhalb von Docker anpassen.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # S-11: kleiner Body-Default (JSON-APIs, SPA, Auth). Nur /uploads erlaubt große Dateien.
    client_max_body_size 2m;
    # S-11: Slow-Header-/Slow-Body-Angriffe (slowloris) begrenzen. Betrifft die REQUEST-Seite;
    # send_timeout (Antwort-Seite) bleibt Default, sonst würden /mcp- und /sync/bootstrap-Streams
    # mit langen Pausen gekappt.
    client_header_timeout 15s;
    client_body_timeout 15s;

    # S-11: Obergrenze gleichzeitiger Verbindungen je IP (global). /collab setzt zusätzlich eine
    # eigene, strengere Grenze (limit_conn erbt wie add_header nicht in Locations mit eigenem
    # limit_conn, daher dort wiederholt).
    limit_conn lineal_conn 200;

    # S-12: maskiertes Zugriffslog (keine Query, redigierte Token-Pfade) nach stdout.
    access_log /var/log/nginx/access.log lineal_masked;

    root /usr/share/nginx/html;

    set $lineal_upstream http://server:8080;

    # Server nicht erreichbar: schnell scheitern statt bis zu 60 s zu hängen (B3.11).
    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    # Fehlerantworten für API-Clients als JSON (mit Retry-After), nie als nginx-HTML.
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @backend_unavailable;
    error_page 413 = @too_large;

    # Sicherheits-Header: NUR auf Antworten, die nginx selbst ausliefert (statische Locations unten,
    # via `include .../lineal-security-headers.conf`). Auf proxied Antworten setzt sie die App
    # (security_headers.rs) – hier bewusst KEIN add_header auf server-Ebene, sonst stünden sie
    # doppelt und überschrieben das strengere `no-referrer` der App auf /calendar.

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Ersetzt (nicht anhängen): Der Server vertraut nur diesem Proxy (LINEAL_TRUSTED_PROXIES).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Login, Einladung, OAuth-Token: eng begrenzt. Body bleibt beim kleinen Default (Tokens/JSON).
    location ~ ^/(auth/login|invite/accept|oauth/token|oauth/register)$ {
        limit_req zone=lineal_auth burst=10 nodelay;
        proxy_pass $lineal_upstream;
    }

    # GraphQL (exakt): JSON-Mutationen/Queries. Datei-Bytes laufen NICHT hierüber (Upload = PUT
    # /uploads, Import = Token/URL), daher reicht ein moderates Limit mit Luft für große Batches.
    location = /graphql {
        client_max_body_size 8m;
        limit_req zone=lineal_api burst=200 nodelay;
        proxy_pass $lineal_upstream;
    }

    # Echtzeit-Sync (WebSocket). Eigene proxy_set_header (Upgrade/Connection) heben die vererbten
    # auf – Host/X-Forwarded-* daher hier wiederholen.
    location = /sync {
        limit_req zone=lineal_api burst=100 nodelay;
        proxy_pass $lineal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Echtzeit-Mitbearbeitung (WebSocket, docs/06 §1.9 Stufe 2): Upgrade, lange Timeouts, kein
    # Puffer. Edge-Limits: Verbindungsaufbau je IP (limit_req) und gleichzeitige Verbindungen je IP
    # (limit_conn; global + die strengere /collab-Grenze). Eigene proxy_set_header heben die
    # vererbten auf – Host/X-Forwarded-* daher wiederholen.
    # Räume leben im Serverprozess: bei mehreren Server-Instanzen Sticky Sessions je Dokument nötig
    # (siehe docs/15, offene Punkte).
    location ^~ /collab/ {
        limit_req zone=lineal_api burst=60 nodelay;
        limit_conn lineal_conn 200;
        limit_conn lineal_collab_conn 40;
        proxy_pass $lineal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Datei-Upload (PUT, signiertes Token): einzige Location mit großem Body (App-Limit 50 MiB).
    # proxy_request_buffering off: nginx spoolt die Datei nicht auf Platte (S-11 „Spool-Last"), der
    # Server begrenzt selbst; ein Retry über proxy_next_upstream entfällt – bei Einmal-Token egal.
    location ^~ /uploads/ {
        client_max_body_size 52m;
        proxy_request_buffering off;
        limit_req zone=lineal_api burst=200 nodelay;
        proxy_pass $lineal_upstream;
    }

    # Bootstrap des Sync-Caches (HTTP, zeilenweises JSON): ohne Puffer, damit Pakete sofort ankommen.
    location = /sync/bootstrap {
        limit_req zone=lineal_api burst=20 nodelay;
        proxy_pass $lineal_upstream;
        proxy_buffering off;
    }

    # MCP (Streamable HTTP, Antworten ggf. als Stream): ohne Puffer. Body mit Luft für Batches.
    location /mcp {
        client_max_body_size 8m;
        limit_req zone=lineal_api burst=100 nodelay;
        proxy_pass $lineal_upstream;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # S-11/Niedrig: /readyz kostet je Aufruf eine DB-Transaktion und hat kein Server-Limit. Am Edge
    # sperren; der Container-Healthcheck fragt /readyz direkt am Server-Port, nicht über nginx.
    location = /readyz {
        access_log off;
        return 404;
    }

    location ~ ^/(graphql|auth/|oauth/|files/|calendar/|invite/accept|\.well-known/|healthz$) {
        limit_req zone=lineal_api burst=200 nodelay;
        proxy_pass $lineal_upstream;
    }

    # Dotfiles (/.env, /.git/config …): echte 404, nie die Startseite. Steht NACH der proxied
    # Regex-Location, damit /.well-known/ (ACME, OAuth-Metadaten) vorher matcht und weiter proxied.
    location ~ /\. {
        return 404;
    }

    # Gehashte Build-Artefakte lange cachen.
    location ^~ /assets/ {
        include /etc/nginx/snippets/lineal-security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Einladungsseite `/invite/<token>` (SPA): der Token steht in der URL, daher kein Referer an Dritte
    # und kein Caching. `POST /invite/accept` fängt die Regex-Location oben ab.
    location /invite/ {
        include /etc/nginx/snippets/lineal-security-headers.conf;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    # Favicon: kein Soft-404 (der Browser fragt ihn immer an); inline als SVG.
    location = /favicon.ico {
        include /etc/nginx/snippets/lineal-security-headers.conf;
        types { }
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400" always;
        return 200 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="#5e6ad2"/></svg>';
    }

    # Pfade mit Dateiendung, die nicht existieren (/robots.txt, /x.js), sind echte 404,
    # keine index.html (kein Soft-404). `/invite/<token>` und Client-Routen haben keine Endung.
    location ~ \.[A-Za-z0-9]+$ {
        include /etc/nginx/snippets/lineal-security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA: alle übrigen Pfade auf index.html (Client-Routing), nie cachen.
    location / {
        include /etc/nginx/snippets/lineal-security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location @rate_limited {
        internal;
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":"rate_limited","message":"Rate limit exceeded. Try again shortly.","status":429,"details":{"retryAfter":5}}';
    }

    location @backend_unavailable {
        internal;
        default_type application/json;
        add_header Retry-After 2 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"unavailable","message":"The server is temporarily unavailable. Try again shortly.","status":503,"details":{"retryAfter":2}}';
    }

    location @too_large {
        internal;
        default_type application/json;
        return 413 '{"error":"limit_exceeded","message":"Request body exceeds the maximum size.","status":413}';
    }
}

# Eigene, cookielose Datei-Origin für die Inline-Ansicht von HTML-Anhängen (Weg B, KOL-478,
# docs/superpowers/specs/2026-11-13-html-anhang-tab.md). Dieser Block MUSS existieren: ohne ihn
# fiele der Datei-Host auf den Catch-all `_` oben zurück und würde die SPA (statische Locations)
# ausliefern – dann wäre dort ein Session-Cookie möglich und die Isolation gebrochen. Hier lebt
# ausschließlich /files/*; alles andere ist 404. Der Server setzt zusätzlich einen App-Guard
# (LINEAL_FILES_BASE_URL), der dieselbe Eigenschaft unabhängig vom Proxy hält.
#
# PFLICHT bei der Installation: server_name auf die echte Datei-Origin setzen (identisch zum Host
# aus LINEAL_FILES_BASE_URL), hier als Platzhalter `lineal-files.example`.
server {
    listen 8080;
    server_name lineal-files.example;
    server_tokens off;

    client_max_body_size 2m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    limit_conn lineal_conn 200;

    # S-12: maskiertes Zugriffslog (Token-Pfade redigiert) wie bei der App-Origin.
    access_log /var/log/nginx/access.log lineal_masked;

    set $lineal_upstream http://server:8080;
    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;
    error_page 429 = @files_rate_limited;
    error_page 502 503 504 = @files_unavailable;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Nur signierte Downloads/Ansichten. Der Server entscheidet anhand des Host-Headers über
    # Inline + Präsentations-CSP (sandbox allow-scripts) bzw. Download.
    location ^~ /files/ {
        limit_req zone=lineal_api burst=200 nodelay;
        proxy_pass $lineal_upstream;
    }

    # Keine SPA, kein /login, kein GraphQL: alles außer /files/* ist hier 404.
    location / {
        return 404;
    }

    location @files_rate_limited {
        internal;
        default_type application/json;
        add_header Retry-After 5 always;
        return 429 '{"error":"rate_limited","message":"Rate limit exceeded. Try again shortly.","status":429,"details":{"retryAfter":5}}';
    }

    location @files_unavailable {
        internal;
        default_type application/json;
        add_header Retry-After 2 always;
        return 503 '{"error":"unavailable","message":"The server is temporarily unavailable. Try again shortly.","status":503,"details":{"retryAfter":2}}';
    }
}

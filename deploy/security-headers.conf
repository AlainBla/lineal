# Sicherheits-Header für Antworten, die nginx SELBST ausliefert (SPA-HTML, /assets, Favicon,
# Dotfile-404). Genau eine Ebene ist zuständig: Proxied Antworten bekommen ihre Header von der
# App (crates/lineal-api/src/security_headers.rs); nginx setzt sie dort NICHT, sonst stünden sie
# doppelt und würden z. B. das strengere `Referrer-Policy: no-referrer` auf /calendar überschreiben.
#
# WICHTIG: Diese Datei NICHT nach conf.d/ legen – dort würde sie als http-Block jede Antwort treffen
# (auch proxied → wieder doppelt). Sie wird nach /etc/nginx/snippets/ kopiert (siehe Dockerfile) und
# absolut per `include` in die statischen Locations eingebunden.
#
# `add_header` in nginx hängt an, ersetzt nicht. Referrer-Policy steht daher NICHT hier, sondern je
# Location genau einmal (strict-origin-when-cross-origin normal, no-referrer auf /invite/), sonst
# gäbe es zwei widersprüchliche Werte.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Skripte nur vom eigenen Ursprung (kein Inline-Skript); Inline-Styles für TipTap/Tailwind nötig;
# WebSockets (/sync, /collab) deckt 'self' ab (gilt auch für ws/wss zum eigenen Ursprung).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HSTS: der TLS-Abschluss (Caddy auf dem Host) terminiert HTTPS; der Header gilt dann im Browser.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Browser-Funktionen, die die App nicht braucht, komplett sperren.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
# Fenster-/Ressourcen-Isolation gegen Cross-Origin-Zugriff (die App läuft auf genau einem Ursprung).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
